<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Live Feed</title>  
    <link rel="stylesheet" href="styles.css">  

    <!-- Firebase SDK -->  
    <script type="module">  
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";  
        import { getDatabase, ref, push, set, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";  

        // Firebase Configuration  
        const firebaseConfig = {  
            apiKey: "AIzaSyDSFHZtU...",
            authDomain: "livefeedapp-e102c.firebaseapp.com",  
            databaseURL: "https://livefeedapp-e102c-default-rtdb.asia-southeast1.firebasedatabase.app",  
            projectId: "livefeedapp-e102c",  
            storageBucket: "livefeedapp-e102c.firebaseapp.com",  
            messagingSenderId: "228665792353",  
            appId: "1:228665792353:web:43d7274a3e355689eb1720"  
        };  

        const app = initializeApp(firebaseConfig);  
        const db = getDatabase(app);  

        // Check if user is authenticated  
        if (!localStorage.getItem("userID")) {  
            window.location.href = "signup.html"; // Redirect if not signed up  
        }  

        let userID = localStorage.getItem("userID");  
        let userIP = null;  

        // Fetch User IP  
        async function getUserIP() {  
            let response = await fetch("https://api64.ipify.org?format=json");  
            let data = await response.json();  
            userIP = data.ip;  
        }  
        getUserIP();  

        // Function to Send Post  
        window.sendPost = function() {  
            let username = document.getElementById("username").value;  
            let title = document.getElementById("title").value;  
            let description = document.getElementById("description").value;  

            if (!username || !title || !description) {  
                alert("All fields are required!");  
                return;  
            }  

            let postId = push(ref(db, "posts")).key;  

            set(ref(db, "posts/" + postId), {  
                username,  
                title,  
                description,  
                reactions: { like: 0, heart: 0, laugh: 0, sad: 0, angry: 0 },  
                reactedIPs: {}  
            }).then(() => {  
                document.getElementById("username").value = "";  
                document.getElementById("title").value = "";  
                document.getElementById("description").value = "";  
            });  
        };  

        // Function to Load Posts  
        function loadPosts() {  
            onValue(ref(db, "posts"), (snapshot) => {  
                let feed = document.getElementById("feed");  
                feed.innerHTML = "";  

                snapshot.forEach(child => {  
                    let data = child.val();  
                    let postId = child.key;  
                    let reacted = data.reactedIPs?.[userIP] ? "disabled" : "";  

                    let postElement = `  
                        <div class="post" id="post_${postId}">  
                            <h4>${data.title} - <small>by ${data.username}</small></h4>  
                            <p>${data.description}</p>  
                            <div class="actions">  
                                <button onclick="reactPost('${postId}', 'like')" ${reacted}>👍 ${data.reactions.like}</button>  
                                <button onclick="reactPost('${postId}', 'heart')" ${reacted}>❤️ ${data.reactions.heart}</button>  
                                <button onclick="reactPost('${postId}', 'laugh')" ${reacted}>😂 ${data.reactions.laugh}</button>  
                                <button onclick="reactPost('${postId}', 'sad')" ${reacted}>😢 ${data.reactions.sad}</button>  
                                <button onclick="reactPost('${postId}', 'angry')" ${reacted}>😡 ${data.reactions.angry}</button>  
                                <button onclick="deletePost('${postId}')">🗑 Delete</button>  
                            </div>  
                        </div>  
                    `;  
                    feed.innerHTML += postElement;  
                });  
            });  
        }  

        // Function to React to a Post (One IP Per Post)  
        window.reactPost = function(postId, reactionType) {  
            get(ref(db, "posts/" + postId)).then(snapshot => {  
                if (snapshot.exists()) {  
                    let postData = snapshot.val();  
                    if (postData.reactedIPs?.[userIP]) return;  

                    postData.reactions[reactionType] += 1;  
                    postData.reactedIPs[userIP] = true;  

                    update(ref(db, "posts/" + postId), {  
                        reactions: postData.reactions,  
                        reactedIPs: postData.reactedIPs  
                    });  
                }  
            });  
        };  

        // Function to Delete Post  
        window.deletePost = function(postId) {  
            remove(ref(db, "posts/" + postId));  
        };  

        loadPosts();  
    </script>  
</head>  
<body>  
    <h2>Live Feed</h2>  

    <input type="text" id="username" placeholder="Your Name"><br><br>  
    <input type="text" id="title" placeholder="Title"><br><br>  
    <textarea id="description" placeholder="Description"></textarea><br><br>  
    <button onclick="sendPost()">Post</button>  

    <h3>Live Feed:</h3>  
    <div id="feed"></div>  
</body>  
</html>
