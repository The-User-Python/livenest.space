<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Livenest.com</title>
    <meta name="description" content="Log in to your Livenest account and connect with an active community.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Livenest.com</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="signup.html">Signup</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2>Login to Your Account</h2>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required>

        <label for="password">Password:</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
    </form>
    <p id="error-message" class="error"></p>
    <p>Don't have an account? <a href="signup.html">Sign up here</a>.</p>
</main>

<script>
    const API_KEY = "$2a$10$vtjAuxAXEgVLvzzWGE09kequc2apyPEh4Ke9cZHg6DIFHa0W7LUQy"; // JSONBin API Key
    const BIN_ID = "67e3c7d08a456b79667cf4e8"; // JSONBin Bin ID

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMessage = document.getElementById("error-message");

        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                method: "GET",
                headers: {
                    "X-Master-Key": API_KEY
                }
            });

            if (!response.ok) {
                throw new Error("Failed to fetch user data.");
            }

            const data = await response.json();
            const users = data.record.users || [];

            const user = users.find(user => user.username === username && user.password === password);

            if (user) {
                localStorage.setItem("loggedInUser", username);
                alert("Login successful!");
                window.location.href = "index.html";
            } else {
                errorMessage.textContent = "Invalid username or password. Please try again.";
            }

        } catch (error) {
            console.error("Error:", error);
            errorMessage.textContent = "An error occurred while logging in. Please try again later.";
        }
    });
</script>

<footer>
    <p>&copy; 2025 Livenest.com. All rights reserved.</p>
</footer>

</body>
</html>
